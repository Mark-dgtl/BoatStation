{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    <div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
        Вход в аккаунт
      </h2>
    </div>
    <form class="mt-8 space-y-6" action="/api/auth/login" method="post">
      <input type="hidden" name="next" value="/">
      <div class="rounded-md shadow-sm -space-y-px">
        <div>
          <label for="login" class="sr-only">Логин</label>
          <input id="login" name="login" type="text" required class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm" placeholder="Логин">
        </div>
        <div>
          <label for="password" class="sr-only">Пароль</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm" placeholder="Пароль">
        </div>
      </div>

      <div class="flex items-center justify-between">
        <div class="text-sm">
          <a href="/api/auth/register_form" class="font-medium text-blue-600 hover:text-blue-500">
            Нет аккаунта? Зарегистрируйтесь
          </a>
        </div>
      </div>

      <div>
        <button type="submit" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
          Войти
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
