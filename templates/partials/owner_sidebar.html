<aside class="w-64 bg-slate-900 text-slate-100 shadow-xl flex-shrink-0 flex flex-col min-h-screen">
    <div class="px-4 h-16 flex items-center border-b border-slate-700/80">
        <img src="{{ url_for('static', path='/logo.png') }}" alt="Логотип" class="h-8 w-auto mr-2 brightness-110">
        <span class="text-lg font-bold text-violet-300">Владелец</span>
    </div>
    <div class="p-4 border-b border-slate-700/80">
        <p class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Учётная запись</p>
        <p class="text-sm font-medium text-white mt-1 truncate" title="{{ user.login }}">{{ user.login }}</p>
        <span class="inline-flex mt-2 items-center rounded-full bg-violet-500/20 px-2.5 py-0.5 text-xs font-medium text-violet-300 ring-1 ring-violet-500/30">
            Полный доступ
        </span>
    </div>
    <nav class="flex-1 p-3">
        <p class="px-3 mb-2 text-[10px] uppercase tracking-widest text-slate-500 font-semibold">Панель владельца</p>
        <ul class="space-y-1">
            <li>
                <a href="/api/superadmin/dashboard"
                   class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all
                   {% if request.path == '/api/superadmin/dashboard' %} bg-violet-600 text-white shadow-lg shadow-violet-900/50 {% else %} text-slate-300 hover:bg-slate-800 hover:text-white {% endif %}">
                    <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                    Обзор станции
                </a>
            </li>
            <li>
                <a href="/api/superadmin/crud"
                   class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all
                   {% if request.path == '/api/superadmin/crud' %} bg-violet-600 text-white shadow-lg shadow-violet-900/50 {% else %} text-slate-300 hover:bg-slate-800 hover:text-white {% endif %}">
                    <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"/></svg>
                    Управление БД
                </a>
            </li>
            <li>
                <a href="/api/superadmin/logs"
                   class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all
                   {% if request.path == '/api/superadmin/logs' %} bg-violet-600 text-white shadow-lg shadow-violet-900/50 {% else %} text-slate-300 hover:bg-slate-800 hover:text-white {% endif %}">
                    <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    Логи сервиса
                </a>
            </li>
        </ul>
        <p class="px-3 mt-6 mb-2 text-[10px] uppercase tracking-widest text-slate-500 font-semibold">Операции (админ)</p>
        <ul class="space-y-1">
            <li>
                <a href="/api/admin/rentals" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition-all">
                    <svg class="w-4 h-4 flex-shrink-0 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                    Заявки и аренды
                </a>
            </li>
            <li>
                <a href="/api/admin/vessels" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition-all">
                    <svg class="w-4 h-4 flex-shrink-0 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                    Флот и ремонты
                </a>
            </li>
        </ul>
    </nav>
    <div class="p-4 border-t border-slate-700/80">
        <a href="/api/auth/logout" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-red-950/40 hover:text-red-300 transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            Выйти
        </a>
    </div>
</aside>
