<aside class="w-64 bg-white shadow-lg flex-shrink-0 min-h-screen border-r relative pb-20">
    <div class="px-4 h-16 flex items-center border-b">
        <img src="{{ url_for('static', path='/logo.png') }}" alt="Логотип" class="h-8 w-auto mr-2">
        <span class="text-xl font-bold text-blue-500">Лодочная станция</span>
    </div>
    <div class="p-4 border-b">
        <h2 class="text-lg font-semibold text-gray-800">Панель администратора</h2>
        <p class="text-sm text-gray-600">{{ user.login if user else 'admin' }}</p>
    </div>
    <nav class="p-2">
        <ul class="space-y-2">
            <li>
                <a href="/api/admin/rentals"
                   class="flex items-center p-3 rounded-lg font-medium transition-all duration-200
                   {% if request.path == '/api/admin/rentals' %} bg-blue-100 text-blue-700 shadow-sm {% else %} text-gray-700 hover:text-blue-600 hover:bg-blue-50 hover:shadow-md {% endif %}">
                    <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    Главная
                </a>
            </li>
            <li>
                <a href="/api/admin/vessels"
                   class="flex items-center p-3 rounded-lg font-medium transition-all duration-200
                   {% if request.path.startswith('/api/admin/vessels') %} bg-blue-100 text-blue-700 shadow-sm {% else %} text-gray-700 hover:text-blue-600 hover:bg-blue-50 hover:shadow-md {% endif %}">
                    <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                    Судна
                </a>
            </li>
            <li>
                <a href="/api/admin/repairs"
                   class="flex items-center p-3 rounded-lg font-medium transition-all duration-200
                   {% if request.path == '/api/admin/repairs' %} bg-blue-100 text-blue-700 shadow-sm {% else %} text-gray-700 hover:text-blue-600 hover:bg-blue-50 hover:shadow-md {% endif %}">
                    <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    Ремонт
                </a>
            </li>
        </ul>
    </nav>
    <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-gray-100 bg-white">
        <a href="/api/auth/logout" class="flex items-center p-3 text-gray-600 hover:text-red-600 hover:bg-red-50 hover:shadow-md rounded-lg transition-all duration-200 font-medium">
            <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            Выйти
        </a>
    </div>
</aside>
